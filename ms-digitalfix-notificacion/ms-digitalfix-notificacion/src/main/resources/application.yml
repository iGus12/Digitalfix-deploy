
server:
  port: 8083

spring:
  application:
    name: ms-digitalfix-notificacion
  # Envio de correos mediante Gmail
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521:XE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/cc0041c5-4918-4ed1-9a20-23dc386471d4/v2.0
          audiences: 898e9076-6eb3-4901-a900-1017f8a7a2f6

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: 5672
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD}

    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

digitalfix:
  mensajes:
    exchanges:
      directo: cmd.direct
      tema: cmd.topic
      dead-letter: cmd.dead.dlx

    colas:
      gmail: q.cmd.email
      gmail-dlq: q.cmd.email.dlq
      despacho: q.cmd.dispatch
      despacho-dlq: q.cmd.dispatch.dlq
      reporte: q.cmd.report
      reporte-dlq: q.cmd.report.dlq
      interna: q.cmd.notificaciones.internas
      interna-dlq: q.cmd.notificaciones.internas.dlq

    routing-keys:
      gmail-directa: email.send
      gmail-tema: email.*
      gmail-dlq: email.dlq
      despacho-directa: dispatch.ticket
      despacho-tema: dispatch.#
      despacho-dlq: dispatch.dlq
      reporte-directa: report.gen
      reporte-tema: report.*
      reporte-dlq: report.dlq
      interna-directa: notificacion.interna
      interna-dlq: notificacion.interna.dlq
